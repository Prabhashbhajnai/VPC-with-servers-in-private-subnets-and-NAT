AWSTemplateFormatVersion: "2010-09-09"
Description: Create 2 EC2, 1 in each AZs with no public access and 1 as a Bastion or the Jump Server

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName

Resources:
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-launch-template"
      LaunchTemplateData:
        ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        InstanceType: t3.micro
        SecurityGroupIds:
          - Fn::ImportValue: PrivateEC2SG
        UserData:
          Fn::Base64: |
            #!/bin/bash

            dnf update -y
            dnf install -y httpd
            systemctl enable httpd
            systemctl start httpd

            TOKEN=$(curl -X PUT "http://169.254.169.254/latest/api/token" \
              -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

            INSTANCE_ID=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/instance-id)

            AZ=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/placement/availability-zone)

            PublicIP=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/public-ipv4)

            PrivateIP=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/local-ipv4)

            AMIid=$(curl -H "X-aws-ec2-metadata-token: $TOKEN" \
              http://169.254.169.254/latest/meta-data/ami-id)

            cat > /var/www/html/index.html <<EOF
            <!DOCTYPE html>
            <html>
            <head>
                <title>CloudFormation Demo</title>
            </head>
            <body>
                <h1>Hello from EC2!</h1>
                <p>Instance: $INSTANCE_ID</p>
                <p>Availability Zone: $AZ</p>
                <p>Public IP: $PublicIP</p>
                <p>Private IP: $PrivateIP</p>
                <p>AMI ID: $AMIid</p>
            </body>
            </html>
            EOF

            systemctl restart httpd

        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: environment
                Value: development
          - ResourceType: volume
            Tags:
              - Key: environment
                Value: development

  JumpServerAsg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: JumpServer-App-ASG
      AvailabilityZoneDistribution:
        CapacityDistributionStrategy: balanced-only
      VPCZoneIdentifier:
        - Fn::ImportValue: PrivateSubnet1
        - Fn::ImportValue: PrivateSubnet2
      DesiredCapacity: 2
      MaxSize: 2
      MinSize: 2
      LaunchTemplate: 
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      TargetGroupARNs:
        - Fn::ImportValue: TargetGroup
      # TrafficSources: Keep either this or the TargetGroupArn
        # - Fn::ImportValue: ALB ARN
      Tags:
      - Key: Name
        Value: JumpServer
        PropagateAtLaunch: true

  BastionServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      InstanceType: t3.micro
      KeyName: !Ref KeyName
      SubnetId: !ImportValue PublicSubnet1
      SecurityGroupIds:
        - Fn::ImportValue: BastionSG
